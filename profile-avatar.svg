<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#ff0080"/>
    </linearGradient>
    <radialGradient id="neonRadial" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)"/>
  <circle cx="200" cy="180" r="160" fill="url(#neonRadial)"/>
  <circle cx="200" cy="180" r="130" fill="none" stroke="url(#glowGrad)" stroke-width="3" stroke-dasharray="12 6" opacity="0.6"/>
  <!-- Modern Tech Developer Silhouette/Figure -->
  <g transform="translate(200, 195)">
    <!-- Shoulders / Jacket -->
    <path d="M-85,155 C-85,90 -55,75 -25,75 L25,75 C55,75 85,90 85,155 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <path d="M-50,75 L-20,155 L20,155 L50,75 Z" fill="#0f172a" stroke="#00f2fe" stroke-width="1.5" opacity="0.8"/>
    <!-- Tech hoodie / collar -->
    <path d="M-30,78 Q0,98 30,78 L20,65 Q0,75 -20,65 Z" fill="#7928ca"/>
    <!-- Neck -->
    <rect x="-18" y="25" width="36" height="45" rx="8" fill="#e2e8f0"/>
    <!-- Head / Jaw -->
    <path d="M-38,-20 C-38,35 -20,55 0,55 C20,55 38,35 38,-20 C38,-55 25,-75 0,-75 C-25,-75 -38,-55 -38,-20 Z" fill="#cbd5e1"/>
    <!-- Modern Tech Hair -->
    <path d="M-42,-25 C-42,-70 -20,-90 5,-90 C30,-90 45,-65 42,-35 C38,-42 25,-55 5,-52 C-15,-50 -32,-35 -42,-25 Z" fill="#1e1b4b"/>
    <!-- Cyber Glasses / HUD -->
    <rect x="-34" y="-20" width="30" height="16" rx="5" fill="#0284c7" fill-opacity="0.85" stroke="#38bdf8" stroke-width="2"/>
    <rect x="4" y="-20" width="30" height="16" rx="5" fill="#0284c7" fill-opacity="0.85" stroke="#38bdf8" stroke-width="2"/>
    <line x1="-4" y1="-12" x2="4" y2="-12" stroke="#38bdf8" stroke-width="2"/>
    <!-- Data HUD lines on visor -->
    <line x1="-30" y1="-12" x2="-8" y2="-12" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 2"/>
    <line x1="8" y1="-12" x2="30" y2="-12" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4 2"/>
    <!-- Smart Smile -->
    <path d="M-12,22 Q0,32 12,22" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- Cyber Nodes and Badges -->
  <circle cx="65" cy="80" r="24" fill="#1e293b" stroke="#00f2fe" stroke-width="2"/>
  <text x="65" y="86" fill="#00f2fe" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">&lt;JS/&gt;</text>
  <circle cx="335" cy="90" r="24" fill="#1e293b" stroke="#7928ca" stroke-width="2"/>
  <text x="335" y="96" fill="#c084fc" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">AI/ML</text>
  <circle cx="70" cy="310" r="22" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="70" y="316" fill="#34d399" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">CSE</text>
  <circle cx="330" cy="300" r="22" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="330" y="306" fill="#fbbf24" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">SIT</text>
</svg>